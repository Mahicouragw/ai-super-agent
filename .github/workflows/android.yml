name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['android-*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare .env from secrets (optional)
        working-directory: flutter_app
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "OPENROUTER_MODEL=${{ secrets.OPENROUTER_MODEL }}" >> .env
      - name: Ensure Android platform (keeps com.example.ai_super_agent)
        working-directory: flutter_app
        run: |
          flutter pub get
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name ai_super_agent .
          fi
      - name: Build APK
        working-directory: flutter_app
        run: |
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: AISuperAgent.apk
          path: flutter_app/build/app/outputs/flutter-apk/*.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-')
        uses: softprops/action-gh-release@v2
        with:
          files: flutter_app/build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
