name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ['android-*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare optional runtime configuration
        working-directory: flutter_app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
        run: |
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nOPENROUTER_API_KEY=%s\nOPENROUTER_MODEL=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$OPENROUTER_API_KEY" "$OPENROUTER_MODEL" > .env
      - name: Ensure Android platform
        working-directory: flutter_app
        run: |
          flutter pub get
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.mahicouragw --project-name ai_super_agent .
          fi
      - name: Build APK
        working-directory: flutter_app
        run: flutter build apk --debug
      - name: Normalize APK filename
        run: cp flutter_app/build/app/outputs/flutter-apk/app-debug.apk AISuperAgent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AISuperAgent.apk
          path: AISuperAgent.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/android-')
        uses: softprops/action-gh-release@v2
        with:
          files: AISuperAgent.apk
          generate_release_notes: true
